# The browser stays on one origin and /api is proxied, the same shape as the
# Vite dev proxy and the Render rewrite: the refresh cookie is SameSite and
# scoped to /api/auth, so a cross-origin API would break session restore.
server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 26m;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location / {
        try_files $uri /index.html;
    }
}

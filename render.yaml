# Render blueprint — the whole system in one file.
#
# New > Blueprint > point at this repo. Render creates four services and asks
# once for the secrets marked `sync: false`; everything else is wired here.
#
# The one thing that is not a preference: **the frontend proxies /api to the
# backend rather than calling it cross-origin.** The refresh cookie is
# httpOnly + SameSite=lax and scoped to /api/auth, which a browser will not
# send to a different site — so a static site talking to `labledger-api...`
# directly would authenticate on first load and silently fail every refresh
# afterwards. The rewrite below keeps the browser on one origin, exactly as the
# Vite dev proxy does locally. Change it to a cross-origin call and the session
# model has to change with it (SameSite=none, Secure, CORS credentials).

services:
  # ---- API ------------------------------------------------------------------
  # An external pinger is what keeps this awake, because a Free web service
  # spins down after 15 minutes idle and the in-process worker sleeps with it.
  # Budget it before switching one on: a workspace gets **750 Free instance
  # hours a month**, and hours are only consumed while a service is *running*.
  # Kept awake continuously, a 31-day month is 744 of those 750 — enough for
  # exactly one always-on Free web service, with nothing spare. Run a second
  # and both are suspended part-way through the month. The static site does not
  # consume instance hours, so this service is the only one that counts.
  - type: web
    name: labledger-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.2"
      - key: ENV
        # Turns on Secure cookies and HSTS. Render terminates TLS, so this is
        # correct here and wrong on localhost.
        value: production
      # Literal public URLs, not `fromService ... property: host`. That
      # property returns the *private network* hostname — a bare `labledger-web`
      # with no scheme and no domain — and it is not supported for static sites
      # at all. Every link the server composes is built by string concatenation
      # (`f"{frontend_url}/login?error=oauth"`), so a bare name produces a
      # *relative* redirect that resolves against whatever path the browser is
      # on. That is not a cosmetic bug: password-reset and invitation links are
      # built the same way, and they would have gone out unusable.
      #
      # These share the hostname assumption the /api rewrite below already
      # makes. If Render ever assigns different names, all three change together.
      - key: BACKEND_URL
        value: https://labledger-api.onrender.com
      - key: FRONTEND_URL
        value: https://labledger-web.onrender.com
      - key: REDIS_URL
        fromService: { type: keyvalue, name: labledger-redis, property: connectionString }
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB_NAME
        value: labledger
      - key: JWT_SECRET
        generateValue: true
      - key: FIELD_ENCRYPTION_KEY
        # NOT generated: it must be exactly 32 bytes base64, and anything
        # already encrypted is unreadable without the same value. Paste the one
        # from your .env or the data does not come back.
        sync: false
      - key: JWT_ACCESS_TTL_MIN
        value: "15"
      - key: JWT_REFRESH_TTL_DAYS
        value: "14"
      - key: SESSION_IDLE_TIMEOUT_MIN
        value: "30"
      - key: MFA_GRACE_DAYS
        value: "7"
      - key: PASSWORD_RESET_TTL_MIN
        value: "30"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: LLM_CONFIDENCE_FLOOR
        value: "0.80"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        # Must match a redirect URI registered in Google Cloud Console exactly,
        # and it must be on the **frontend** origin, not the API's.
        #
        # The sign-in button is `href="/api/auth/google"` — a relative link, so
        # the browser is on labledger-web and the OAuth state cookie that
        # SessionMiddleware sets is stored for labledger-web. Pointing the
        # callback at labledger-api sends the browser to a different site,
        # which does not carry that cookie: Authlib sees no state, raises, and
        # the user lands on `?error=oauth`. The refresh cookie would have been
        # set on the wrong host for the same reason.
        #
        # So the callback goes through the rewrite like every other request:
        #   https://labledger-web.onrender.com/api/auth/google/callback
        sync: false
      - key: EMAILJS_SERVICE_ID
        sync: false
      - key: EMAILJS_PUBLIC_KEY
        sync: false
      - key: EMAILJS_PRIVATE_KEY
        sync: false
      - key: EMAILJS_TEMPLATE_RESET
        sync: false
      - key: EMAILJS_TEMPLATE_INVITE
        sync: false
      - key: ARQ_QUEUE_NAME
        value: labledger:jobs
      # Runs the arq worker inside this process, because Render has no Free
      # instance type for a background worker. See the note below.
      - key: RUN_WORKER_IN_API
        value: "true"
      - key: LOG_LEVEL
        value: info

  # ---- worker ---------------------------------------------------------------
  # There isn't one. Render has no Free instance type for `type: worker` — only
  # web services, static sites, Postgres and Key Value can be Free — so the
  # separate worker this project is designed around costs money to run.
  #
  # Instead the API sets RUN_WORKER_IN_API and runs arq inside its own process.
  # This is a downgrade, stated plainly: extraction is CPU-bound and now shares
  # an event loop with request handling, a free web service spins down after
  # 15 minutes idle, and Render may restart it at any time — any of which kills
  # a job mid-flight, leaving the document in `extracting` until it is
  # reprocessed. Keeping the service awake needs an external pinger, and that
  # burns Free instance hours (see the note on the API service above).
  #
  # To go back to the real shape, put the `type: worker` service back with
  # `plan: starter`, drop RUN_WORKER_IN_API, and give it the same MONGO_URI,
  # FIELD_ENCRYPTION_KEY, GEMINI_API_KEY, REDIS_URL and ARQ_QUEUE_NAME —
  # pulling the secrets with `fromService`/`envVarKey` off labledger-api rather
  # than pasting them twice, because a FIELD_ENCRYPTION_KEY that differs by one
  # character fails every document and says nothing about why.

  # ---- frontend -------------------------------------------------------------
  - type: web
    name: labledger-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      # Order matters. The API rewrite must be matched before the SPA fallback,
      # or every request would be answered with index.html.
      - type: rewrite
        source: /api/*
        destination: https://labledger-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html

  # ---- queue ----------------------------------------------------------------
  # `keyvalue` is the current type; `redis` is a deprecated alias for it.
  # The free instance is in-memory only with no persistence, which for a job
  # queue means anything still queued is lost if it restarts. Acceptable here
  # because a dropped job leaves the document in `extracting` and it can be
  # re-uploaded — not because the queue is durable.
  - type: keyvalue
    name: labledger-redis
    plan: free
    ipAllowList: []   # required on Key Value; empty means no external access
